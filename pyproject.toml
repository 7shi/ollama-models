[project]
name = "ollama-models"
version = "0.1.1"
description = "Inspect and manage Ollama model stores directly from the models directory"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ollama_models"]

[project.scripts]
ollama-models = "ollama_models.cli:main"
